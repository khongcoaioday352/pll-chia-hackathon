name: Reproduce PLLGuard evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reproduce.yml"
      - "evidence/**"
      - "rtl_gf180_snapshot/**"
      - "scripts/**"
      - "verify.py"
      - "mutants.py"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out public artifact
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -n 2
      - name: Replay frozen candidates and validate published matrices
        run: |
          python3 scripts/run_offline_demo.py \
            --rtl rtl_gf180_snapshot \
            --output results/ci_replay \
            --include-time-matched
      - name: Save replay manifest and simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pllguard-offline-replay
          path: results/ci_replay/
          if-no-files-found: warn
          retention-days: 7
