name: Reproduce PLLGuard evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reproduce.yml"
      - "evidence/**"
      - "rtl_gf180_snapshot/**"
      - "scripts/**"
      - "verify.py"
      - "mutants.py"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out public artifact
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          iverilog -V | head -n 2
      - name: Audit generated testbenches for internal forcing
        run: |
          python3 scripts/audit_stimulus_contract.py \
            --rtl rtl_gf180_snapshot \
            --output results/ci_stimulus_contract.json
      - name: Audit behavioral oscillator frequency envelope without simulation
        run: |
          python3 scripts/audit_behavioral_envelope.py \
            --rtl rtl_gf180_snapshot \
            --expected evidence/behavioral_frequency_envelope.json \
            --output results/ci_behavioral_envelope.json
      - name: Replay frozen candidates and validate published matrices
        run: |
          python3 scripts/run_offline_demo.py \
            --rtl rtl_gf180_snapshot \
            --output results/ci_replay \
            --include-time-matched
      - name: Replay 90%, 100%, and 110% behavioral delay cases
        run: |
          python3 scripts/delay_sweep.py \
            --rtl rtl_gf180_snapshot \
            --run evidence/gemini_36_three_v2 \
            --expected-aggregates evidence/delay_sweep_console_summary.json \
            --output results/ci_delay
      - name: Explore reference clock period sensitivity on both groups
        run: |
          python3 scripts/ref_period_sweep.py \
            --rtl rtl_gf180_snapshot \
            --summary evidence/gemini_36_three_v2/summary.json \
            --expected evidence/ref_period_ci_summary.json \
            --output results/ci_ref_period
      - name: Replay combined agent and time-matched human control
        run: |
          python3 scripts/combined_coverage.py \
            --rtl rtl_gf180_snapshot \
            --live evidence/adaptive_reference_live_v3_public.json \
            --output results/ci_combined
      - name: Sweep combined four-test groups across reference periods
        run: |
          python3 scripts/combined_period_sweep.py \
            --rtl rtl_gf180_snapshot \
            --combined results/ci_combined \
            --expected evidence/combined_period_ci_matrix.json \
            --output results/ci_combined_period
      - name: Save replay manifest and simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pllguard-offline-replay
          path: |
            results/ci_replay/
            results/ci_delay/
            results/ci_ref_period/
            results/ci_combined/
            results/ci_combined_period/
            results/ci_stimulus_contract.json
            results/ci_behavioral_envelope.json
          if-no-files-found: warn
          retention-days: 7
